              Hermes helps you understand every run with pace zones, VO2max estimates, race finish-time predictions,
              route heatmaps, and shoe mileage tracking in one focused training workspace.

          <div class="hermes-seo-fallback__feature-grid">
            <article>
              <h3>VO2max and training zones</h3>
              <p>See a useful estimate of aerobic fitness and translate effort into pace zones that make your next workout easier to understand.</p>
            </article>
            <article>
              <h3>Race finish-time predictions</h3>
              <p>Use recent training context to set a realistic race target, compare distances, and arrive at a pacing plan with more confidence.</p>
            </article>
            <article>
              <h3>Route heatmaps</h3>
              <p>Explore where you run and how your routes fit together with visual heatmaps that turn a long activity history into a readable picture.</p>
            </article>
            <article>
              <h3>Shoe mileage tracking</h3>
              <p>Track mileage by shoe so you know which pair is carrying the work and when it may be time to rotate or replace your running shoes.</p>
            </article>
            <article>
              <h3>Strava activity synchronization</h3>
              <p>Connect Strava and bring your running history into Hermes, so your analysis starts with the activities you already recorded.</p>
            </article>
            <article>
              <h3>Training context without noise</h3>
              <p>Keep the important signals together: effort, load, routes, race readiness, and equipment, without making you hunt through disconnected tools.</p>
            </article>
          </div>
        </section>

            <li><strong>Understand.</strong> Review pace, zones, fitness signals, route patterns, and shoe mileage in one place.</li>
            <li><strong>Decide.</strong> Use the context to choose the right effort today and prepare for the races ahead.</li>
          </ol>
        </section>

            <article><h3>What is Hermes running analytics?</h3><p>Hermes turns synced activity into practical context, including pace zones, VO2max estimates, race predictions, route heatmaps, and shoe mileage.</p></article>
            <article><h3>Does Hermes work with Strava?</h3><p>Yes. Connect Strava to import your running history and keep future activities available for analysis.</p></article>

            <article><h3>Who is Hermes for?</h3><p>Hermes is for runners who want a clearer view of training load, routes, race readiness, and the shoes they use across their running week.</p></article>
