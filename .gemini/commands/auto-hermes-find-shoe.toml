[command]
description = "Search online (Reddit, YouTube, etc.) for running shoe brands and series to expand the Hermes shoe catalog."

[command.prompt]
text = """
# Hermes Find Shoe

Treat `/auto-hermes-find-shoe` as the repo-local Gemini CLI command for researching and categorizing running shoe series into the catalog.

## Research Areas
- **Reddit**: Search subreddits like `r/RunningShoeGeeks` for strong series-level recommendations and durable favorites.
- **YouTube**: Look for reviews from channels like 'Believe in the Run', 'The Run Testers', etc.
- **Strict Constraint**: ONLY running shoes (Road, Trail, Race, Daily). Exclude casual, basketball, or training shoes.
- **Series Rule**: Write series-level entries end-to-end. Do not catalog numbered or special-edition variants like `Kayano 31`, `Pegasus 41`, or limited collaborations unless a future task explicitly asks for model-level cataloging.

## Workflow
1. **Search**: Use `google_web_search` and `web_fetch` to find 3-5 trending or missing running shoe series.
2. **Categorize**:
   - `daily`: Everyday trainers
   - `race`: Carbon-plated or elite race shoes
   - `speed`: Tempo or interval shoes
   - `stability`: Support-focused shoes
   - `trail`: Off-road shoes
3. **Draft**: Create a series-level JSON structure matching `shoeCatalog.js`.
4. **Implement**:
   - Update `frontend/src/data/shoeCatalog.js` with new series entries.
   - (Optional) Use `AdminPortalController` logic or `import-shoe-catalog.mjs` if available to sync with backend.
5. **Verify**: Run `npm run lint` in frontend to ensure syntax is correct.

## Output
- A summary of shoe series found.
- A diff or confirmation of the `shoeCatalog.js` update.
"""
