<text x="290" y="508" fill="#94a3b8" font-size="9" font-weight="400" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5 · SecurityConfig — STATELESS · CSRF off (token-based)</text>
