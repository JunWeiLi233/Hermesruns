# Startup course seeding is covered by focused configuration tests. Keep the
# full Spring test suite deterministic and independent of the external OSRM API.
app.official-course.startup-seed.enabled=false

# Metrics are computed on the calling thread and not caught up at startup, so tests stay deterministic.
app.training.async=false
app.training.catchup-on-startup=false
# Run records are likewise analysed on the calling thread and not caught up at startup.
app.records.async=false
app.records.catchup-on-startup=false
# The climb of runs that have none is filled in by the tests that cover it, not at start.
app.elevation.catchup-on-startup=false

# This file shadows the main application.properties on the test classpath, so none of the main
# settings reach the tests. Production runs with open-in-view off; with it on here, a lazy association
# read outside a transaction works in a test and throws LazyInitializationException in production.
spring.jpa.open-in-view=false
