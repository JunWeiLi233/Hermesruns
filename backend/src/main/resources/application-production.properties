# Cloud-ready production defaults. Keep secrets in environment variables.

# Selecting this profile must activate the production guards without a second flag.
hermes.environment=production
server.address=${APP_SERVER_ADDRESS:0.0.0.0}

# Enforce HTTPS at the app layer (safe behind reverse proxy with TLS termination).
app.security.force-https=${APP_FORCE_HTTPS:true}

# Enable strict transport security for HTTPS deployments (including TLS termination behind proxy/LB).
app.security.enable-hsts=${APP_ENABLE_HSTS:true}

# Production should use managed DB credentials from env; this prevents accidental fallback to local defaults.
spring.datasource.url=${APP_DB_URL}
spring.datasource.driverClassName=${APP_DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}

# Avoid schema auto-mutation in cloud environments (override via APP_JPA_DDL_AUTO if needed).
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:validate}

# Apply checked-in workspace migrations as a release step before production startup.
app.training-workspace.migrate=${APP_TRAININGWORKSPACE_MIGRATE:false}
app.schema-compatibility.enabled=false
app.training-workspace.cookie-secure=true

# Published routes are operator-owned. Deployment must never trigger route replacement.
app.official-course.startup-seed.enabled=${HERMES_OFFICIAL_COURSE_STARTUP_SEED_ENABLED:false}
app.course-map.bulk-seed.enabled=false
app.course-map.bulk-scan.enabled=false

# Course sources and route artifacts must survive container replacement.
app.course-map.upload-dir=${HERMES_COURSE_MAP_UPLOAD_DIR:${RAILWAY_VOLUME_MOUNT_PATH:/data}/course-map-images}

# PostgreSQL-only: rewrite JDBC insert batches into multi-row INSERT statements.
# This accelerates ActivityDataAccess's raw-JdbcTemplate GPS point inserts
# (Hibernate-side insert batching is blocked by IDENTITY ids). Must stay out of
# the default profile — H2 does not support reWriteBatchedInserts.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
