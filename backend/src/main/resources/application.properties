spring.application.name=backend

# Set only after qualified review of the independent numeric training rules.
# Both release settings default empty: full previews work, activation stays unavailable.
app.run-plans.approved-ruleset=${APP_RUN_PLANS_APPROVED_RULESET:}
# Explicit experimental release; does not confer qualified approval. Requires runner acknowledgement.
app.run-plans.experimental-ruleset=${APP_RUN_PLANS_EXPERIMENTAL_RULESET:}

# deployment: set HERMES_ENV=production on public servers (enforces stronger Strava webhook settings when Strava is enabled)
hermes.environment=${HERMES_ENV:development}

# Development may seed official courses. Production explicitly disables this writer.
app.official-course.startup-seed.enabled=${HERMES_OFFICIAL_COURSE_STARTUP_SEED_ENABLED:true}

# security hardening: default profile binds loopback only (LAN exposure removed).
# Set APP_SERVER_ADDRESS=0.0.0.0 for container/Docker runs where the app must accept
# external traffic; the production profile (application-production.properties) defaults
# to all interfaces. Both profiles honor the same APP_SERVER_ADDRESS override.
server.address=${APP_SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}

# hide stack traces from default error responses (controllers still return explicit JSON errors)
server.error.include-stacktrace=never
server.error.include-exception=false

# gzip response compression for HTML documents, JSON payloads, CSS and JS bundles.
# SVG covers origin-direct traffic (Cloudflare already compresses it at the edge).
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,application/json,application/json;charset=UTF-8,text/css,application/javascript,text/javascript,image/svg+xml

# trust X-Forwarded-* from reverse proxy (nginx, cloud load balancer)
server.forward-headers-strategy=framework

# Whose X-Forwarded-For is believed when the app works out the client behind a request (the limits on guessing passwords,
# on sign-ups and on requests, the traffic monitor, the logs). A header is read only on a connection from one of these, and
# then only its last address that is not itself one of these; anyone else's header is the client's own and is ignored.
# Addresses, ranges (10.0.0.0/8, fd00::/8) and the words private (the default: loopback, private, shared and link-local
# addresses, where a proxy in front of the app connects from), loopback, none (reached directly) and all (every connection
# is a proxy; only when the proxy is the one way in). See docs/deployment/client-address.md.
app.security.trusted-proxies=${APP_TRUSTED_PROXIES:private}

# Small-container footprint: bound Tomcat worker threads (Boot default is 200).
server.tomcat.threads.max=${APP_TOMCAT_MAX_THREADS:16}
server.tomcat.threads.min-spare=4

# Graceful shutdown: stop accepting new requests and let in-flight work finish
# (bounded by the phase timeout below) before the container is killed.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# production: enforce HTTPS at the app layer (safe behind reverse proxy)
app.security.force-https=${APP_FORCE_HTTPS:false}

# optional: comma-separated origins if the React app is not served from the same host as /api (e.g. https://app.example.com)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

# set true only when the site is served over HTTPS everywhere (via reverse TLS termination is OK)
app.security.enable-hsts=${APP_ENABLE_HSTS:true}

# Database configuration
# Default storage is local H2. To switch to PostgreSQL, provide APP_DB_URL, APP_DB_USERNAME,
# APP_DB_PASSWORD, and APP_DB_DRIVER=org.postgresql.Driver before startup.
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./hermes_db_v2;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${APP_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}

# Small-container footprint: right-size the connection pool (Boot defaults are
# min=max=10). The 6-connection cap is the whole budget, shared by web traffic,
# scheduler ticks, and the one long recalibrate transaction; minimumIdle only
# lets the pool shrink to 2 when idle. keepalive/maxLifetime suit cloud DBs that
# drop idle sockets.
spring.datasource.hikari.maximumPoolSize=${APP_DB_POOL_MAX:4}
spring.datasource.hikari.minimumIdle=${APP_DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${APP_DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.maxLifetime=900000
spring.datasource.hikari.keepaliveTime=300000

# Schema management
spring.jpa.hibernate.ddl-auto=${APP_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Small-container footprint: Hibernate JDBC batching. batch_size + order_updates
# batch the UPDATE statements (e.g. elevation recalibration's saveAll of loaded
# points); INSERT batching is blocked by the IDENTITY ids every entity uses, so
# order_inserts is currently inert (it only affects insert batching). Bulk point
# INSERTs skip Hibernate entirely — see reWriteBatchedInserts in the production
# profile. default_batch_fetch_size trims N+1 lazy loads.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# Redis is disabled by default; skip Redis repository scanning at boot.
spring.data.redis.repositories.enabled=false

# File upload limits (phone screenshots can be 5–10 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Global provider safety budget includes paid/admin AI calls; reservations use a conservative
# operator-supplied upper estimate, not the provider's billed ledger. Amounts are USD.
app.ai.budget.enabled=${APP_AI_BUDGET_ENABLED:true}
app.ai.budget.daily-request-limit=${APP_AI_BUDGET_DAILY_REQUEST_LIMIT:200}
app.ai.budget.monthly-request-limit=${APP_AI_BUDGET_MONTHLY_REQUEST_LIMIT:2000}
app.ai.budget.daily-usd-limit=${APP_AI_BUDGET_DAILY_USD_LIMIT:5.00}
app.ai.budget.monthly-usd-limit=${APP_AI_BUDGET_MONTHLY_USD_LIMIT:50.00}
app.ai.budget.reservation-usd-per-request=${APP_AI_BUDGET_RESERVATION_USD_PER_REQUEST:0.10}

# Aggregate buckets apply before per-route buckets so rotating resource IDs cannot evade limits.
app.api.rate-limit.global-ip-per-minute=${APP_API_RATE_LIMIT_GLOBAL_IP_PER_MINUTE:600}
app.api.rate-limit.global-user-per-minute=${APP_API_RATE_LIMIT_GLOBAL_USER_PER_MINUTE:900}
app.api.rate-limit.activity-read-user-per-minute=${APP_API_RATE_LIMIT_ACTIVITY_READ_USER_PER_MINUTE:180}
app.api.rate-limit.auth-read-user-per-minute=${APP_API_RATE_LIMIT_AUTH_READ_USER_PER_MINUTE:90}
app.api.rate-limit.checkout-ip-per-minute=${APP_API_RATE_LIMIT_CHECKOUT_IP_PER_MINUTE:5}
app.api.rate-limit.checkout-user-per-minute=${APP_API_RATE_LIMIT_CHECKOUT_USER_PER_MINUTE:5}

# Google OAuth 2.0 Credentials
# Configure these with environment variables before starting Hermes.
google.client.id=${APP_GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
google.client.secret=${APP_GOOGLE_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
app.google.redirect-uri=${APP_GOOGLE_REDIRECT_URI:${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}}

# Google reCAPTCHA v3 for password sign-up. Keep the secret server-side;
# only the site key is returned to the frontend by /api/auth/providers.
recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.threshold=${RECAPTCHA_THRESHOLD:0.5}

# Strava OAuth 2.0 Credentials
# Configure these with environment variables before starting Hermes.
# Strava token storage also requires APP_DATA_ENCRYPTION_KEY.
strava.client.id=${STRAVA_CLIENT_ID:${APP_STRAVA_CLIENT_ID:}}
strava.client.secret=${STRAVA_CLIENT_SECRET:${APP_STRAVA_CLIENT_SECRET:}}
app.strava.redirect-uri=${STRAVA_REDIRECT_URI:${APP_STRAVA_REDIRECT_URI:http://localhost:8080/api/auth/strava/callback}}

# Small-container footprint: @Scheduled jobs share one thread by default; two
# threads reduce the chance that a long Strava sync tick delays the other jobs
# (two long syncs can still hold both threads and delay the other four).
spring.task.scheduling.pool.size=2

# Automated coach (polarized 80/20, nightly audit)
app.coach.nightly.enabled=true
app.coach.nightly.cron=0 0 3 * * *

# Background Strava pull (uses stored refresh tokens; Hermes must stay running)
strava.sync.enabled=true
# Default 10 minutes — pulls recent activities for every Strava-linked runner
strava.sync.interval-ms=${STRAVA_SYNC_INTERVAL_MS:600000}
# Pages × 200 activities max per runner per scheduled run (newest pages first; stops early if no new runs)
strava.sync.max-pages-recent=${STRAVA_SYNC_MAX_PAGES_RECENT:3}
# Full history cap (login / manual resync)
strava.sync.max-pages-full=50
# Re-list only activities newer than the last successful sync minus this safety buffer (6h default)
strava.sync.cursor-buffer-seconds=${STRAVA_SYNC_CURSOR_BUFFER_SECONDS:21600}
# A runner created before list cursors existed starts scheduled/app-open recent sync
# from this bounded lookback. Explicit OAuth/link/manual full sync remains unbounded.
strava.sync.bootstrap-lookback-days=${STRAVA_SYNC_BOOTSTRAP_LOOKBACK_DAYS:14}
# Treadmill/no-GPS runs are tombstoned and re-checked at most once per this window
strava.sync.no-gps-retry-days=${STRAVA_SYNC_NO_GPS_RETRY_DAYS:30}
# When consecutive scheduler cycles find nothing new, the effective interval doubles up to this cap
strava.sync.backoff-max-minutes=${STRAVA_SYNC_BACKOFF_MAX_MINUTES:60}

garmin.wellness.sync.enabled=${GARMIN_WELLNESS_SYNC_ENABLED:true}
garmin.wellness.sync.interval-ms=${GARMIN_WELLNESS_SYNC_INTERVAL_MS:1800000}
garmin.wellness.sync.days-back=${GARMIN_WELLNESS_SYNC_DAYS_BACK:30}
garmin.wellness.sync.initial-days-back=${GARMIN_WELLNESS_SYNC_INITIAL_DAYS_BACK:90}

# Strava Webhook (push notifications for new activities)
# Create a subscription once via Strava API:
#   POST https://www.strava.com/api/v3/push_subscriptions
#   client_id, client_secret, callback_url=https://YOUR_DOMAIN/api/strava/webhook,
#   verify_token=<same value as below>
strava.webhook.verify-token=${STRAVA_WEBHOOK_VERIFY_TOKEN:}

# Strava API Policy lets an app keep data fetched from the Strava API for at most 7 days.
# 0 (default) keeps Strava-API runs indefinitely, as Hermes always has. Set 7 to enforce the policy
# limit: runs older than this many days are deleted nightly (with the shoe mileage, personal records
# and rewards built from them). Runs imported from the runner's own files are never deleted.
app.strava.retention-days=${APP_STRAVA_RETENTION_DAYS:0}

# AI Vision API (for shoe image scanning)
# Set APP_AI_API_KEY to enable AI-powered shoe mileage extraction from screenshots.
app.ai.api-key=${APP_AI_API_KEY:}
app.ai.model=${APP_AI_MODEL:gemini-2.5-flash}
app.ai.provider=${APP_AI_PROVIDER:gemini}
app.ai.course-map.provider=${APP_AI_COURSE_MAP_PROVIDER:qwen-local}
app.ai.course-map.pdf-render-page-limit=${APP_AI_COURSE_MAP_PDF_RENDER_PAGE_LIMIT:24}
app.ai.free-tier.per-runner-daily-limit=${APP_AI_FREE_TIER_PER_RUNNER_DAILY_LIMIT:5}
app.ai.free-tier.project-daily-limit=${APP_AI_FREE_TIER_PROJECT_DAILY_LIMIT:200}
app.ai.free-tier.project-daily-reserve=${APP_AI_FREE_TIER_PROJECT_DAILY_RESERVE:20}

# Marathon route extraction pipeline
# Step 1 uses local Qwen structured JSON output. Step 2 shells out to the local Python/OpenCV worker.
app.route-extraction.python-command=${APP_ROUTE_EXTRACTION_PYTHON_COMMAND:python}
app.route-extraction.python-script=${APP_ROUTE_EXTRACTION_PYTHON_SCRIPT:}
app.route-extraction.qwen.model-id=${APP_ROUTE_EXTRACTION_QWEN_MODEL_ID:Qwen/Qwen2.5-VL-7B-Instruct}
app.route-extraction.qwen.device-map=${APP_ROUTE_EXTRACTION_QWEN_DEVICE_MAP:auto}
app.route-extraction.qwen.cache-dir=${APP_ROUTE_EXTRACTION_QWEN_CACHE_DIR:}
app.route-extraction.qwen.timeout-seconds=${APP_ROUTE_EXTRACTION_QWEN_TIMEOUT_SECONDS:300}
app.route-extraction.qwen.alignment-timeout-seconds=${APP_ROUTE_EXTRACTION_QWEN_ALIGNMENT_TIMEOUT_SECONDS:720}
app.route-extraction.qwen.parameters-script=${APP_ROUTE_EXTRACTION_QWEN_PARAMETERS_SCRIPT:}
app.route-extraction.qwen.anchor-script=${APP_ROUTE_EXTRACTION_QWEN_ANCHOR_SCRIPT:}
app.route-extraction.qwen.alignment-script=${APP_ROUTE_EXTRACTION_QWEN_ALIGNMENT_SCRIPT:}

# Marathon route map matching
app.route-matching.osrm.base-url=${APP_ROUTE_MATCHING_OSRM_BASE_URL:https://router.project-osrm.org}
app.route-matching.osrm.profile=${APP_ROUTE_MATCHING_OSRM_PROFILE:driving}

# Stripe Checkout (Pro subscription — one-time payment per checkout, extends Pro by line-item quantity months)
# Create a one-time Price in Stripe Dashboard and paste its price_xxx id. Webhook: POST /api/billing/webhook
app.billing.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.billing.stripe.price-pro-monthly=${STRIPE_PRICE_PRO_MONTHLY:}
app.billing.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
# Optional: shown in the Profile UI only (e.g. $9 / month or ¥68/月)
app.billing.price-display-label=${APP_BILLING_PRICE_LABEL:}

# Administrator zero-trust and phishing-resistant MFA. Production startup refuses
# to run unless both controls are enabled and fully configured.
app.security.admin-mfa.enabled=${HERMES_ADMIN_MFA_ENABLED:true}
app.security.admin-mfa.rp-id=${HERMES_WEBAUTHN_RP_ID:localhost}
app.security.admin-mfa.rp-name=${HERMES_WEBAUTHN_RP_NAME:Hermes Admin}
app.security.admin-mfa.allowed-origins=${HERMES_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:8080}
app.security.admin-mfa.bootstrap-token=${HERMES_ADMIN_MFA_BOOTSTRAP_TOKEN:}
app.security.admin-access.enabled=${HERMES_ADMIN_ACCESS_ENABLED:false}
app.security.admin-access.team-domain=${HERMES_ADMIN_ACCESS_TEAM_DOMAIN:}
app.security.admin-access.audience=${HERMES_ADMIN_ACCESS_AUDIENCE:}
app.security.admin-access.allowed-emails=${HERMES_ADMIN_ACCESS_ALLOWED_EMAILS:}

# Transactional email (disabled by default for local development).
app.mail.provider=${APP_MAIL_PROVIDER:disabled}
app.mail.resend.api-key=${RESEND_API_KEY:}
app.mail.resend.endpoint=${APP_MAIL_RESEND_ENDPOINT:https://api.resend.com/emails}
app.mail.from=${APP_MAIL_FROM:}
app.mail.reply-to=${APP_MAIL_REPLY_TO:}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Local dev mock runner — OPT-IN. Disabled by default; enable with APP_LOCAL_SHARED_RUNNER_ENABLED=true
# to get a logged-in runner with pre-seeded mock activities and shoes for browser-based testing.
# When enabled you MUST set APP_LOCAL_SHARED_RUNNER_PASSWORD to your own secret (bootstrap refuses
# to run with a blank password). Also disabled automatically in production
# (see LocalSharedRunnerBootstrapConfiguration).
# Fixtures are seeded only when the runner is first created; later user deletions are preserved.
app.local-shared-runner.enabled=${APP_LOCAL_SHARED_RUNNER_ENABLED:false}
app.local-shared-runner.password=${APP_LOCAL_SHARED_RUNNER_PASSWORD:}
app.local-shared-runner.seed-mock-data=${APP_LOCAL_SHARED_RUNNER_SEED_MOCK_DATA:false}

# Feature quota gating (premium feature limits for free users; -1 = unlimited for Pro)
app.quota.free.shoe-scan=2
app.quota.free.muscle-plan=0
app.quota.pro.shoe-scan=-1
app.quota.pro.muscle-plan=-1

# Keep JPA sessions open only for the repository layer. Controllers return
# DTOs, so nothing relies on lazy loading during serialization; open sessions
# per request just hold DB connections longer under load.
spring.jpa.open-in-view=false

# Tighten in-process TTL cache when Redis is off (Railway default).
app.cache.local-max-entries=${APP_CACHE_LOCAL_MAX_ENTRIES:512}
app.cache.local-max-value-bytes=${APP_CACHE_LOCAL_MAX_VALUE_BYTES:524288}
app.cache.local-max-total-bytes=${APP_CACHE_LOCAL_MAX_TOTAL_BYTES:16777216}

# Feed list bound (RFC-005): missing ?limit= defaults here; explicit values clamp to max.
# Cursor pagination is required before raising max above 500.
app.activities.default-limit=${APP_ACTIVITIES_DEFAULT_LIMIT:500}
app.activities.max-limit=${APP_ACTIVITIES_MAX_LIMIT:500}

# In-process map-tile raw-byte cache (RFC-005). Default 24 MiB; tune 16–32 MiB via env.
app.map-tile.local-max-bytes=${APP_MAP_TILE_LOCAL_MAX_BYTES:25165824}


# Training metrics: effort score and heart-rate zone times per run.
# Heart-rate zone boundaries as percentages of max heart rate (the first bpm of zones 2 to 5).
app.training.hr-zone-percentages=${APP_TRAINING_HR_ZONE_PERCENTAGES:60,70,80,90}
# Computed off the request thread; tests set this to false so results are there when a call returns.
app.training.async=${APP_TRAINING_ASYNC:true}
# After each start, compute metrics for runs that have none (newest first, at most this many per start).
app.training.catchup-on-startup=${APP_TRAINING_CATCHUP_ON_STARTUP:true}
app.training.catchup-max-runs=${APP_TRAINING_CATCHUP_MAX_RUNS:500}
# Runs recomputed per batch when a runner's history is recomputed.
app.training.recompute-batch=${APP_TRAINING_RECOMPUTE_BATCH:50}

# First-party training/coaching/team workspace. Shares Runner/Activity/plan authorities.
app.training-workspace.enabled=${APP_TRAININGWORKSPACE_ENABLED:true}
# Default auto-migration is H2 only. Configured PostgreSQL requires the release migration.
app.training-workspace.migrate=${APP_TRAININGWORKSPACE_MIGRATE:h2}
app.training-workspace.cookie-secure=${APP_TRAININGWORKSPACE_COOKIESECURE:${app.security.force-https:false}}
app.training-workspace.jobs-enabled=${APP_TRAININGWORKSPACE_JOBSENABLED:true}
app.training-workspace.private-directory=${APP_TRAININGWORKSPACE_PRIVATEDIRECTORY:./.training-private}

# Fitness, fatigue and form: two averages of a runner's daily effort, fitness the slow one and fatigue the fast one,
# each given as the number of days its time constant spans (fatigue must be the shorter).
app.training.fitness-days=${APP_TRAINING_FITNESS_DAYS:42}
app.training.fatigue-days=${APP_TRAINING_FATIGUE_DAYS:7}
# A week's usual effort is the mean of the three weeks before it, plus and minus this share (0.2 is 20%).
app.training.weekly-range-band=${APP_TRAINING_WEEKLY_RANGE_BAND:0.2}
# The longest window a series request may ask for, in days.
app.training.series-max-days=${APP_TRAINING_SERIES_MAX_DAYS:400}

# After each start, give a climb figure to runs imported from a file before the importer worked it out (newest first, at most this many per start).
app.elevation.catchup-on-startup=${APP_ELEVATION_CATCHUP_ON_STARTUP:true}
app.elevation.catchup-max-runs=${APP_ELEVATION_CATCHUP_MAX_RUNS:500}

# Run records: best efforts per run and the route groups that find same-route runs.
# Worked out off the request thread; tests set this to false so results are there when a call returns.
app.records.async=${APP_RECORDS_ASYNC:true}
# After each start, analyse runs that have not been (newest first, at most this many per start).
app.records.catchup-on-startup=${APP_RECORDS_CATCHUP_ON_STARTUP:true}
app.records.catchup-max-runs=${APP_RECORDS_CATCHUP_MAX_RUNS:500}
# Two runs are the same route when they start and finish within this many metres of each other and their distances are
# within this many per cent. Strava names these criteria and does not publish its thresholds.
app.records.match.endpoint-tolerance-m=${APP_RECORDS_MATCH_ENDPOINT_TOLERANCE_M:150}
app.records.match.distance-tolerance-pct=${APP_RECORDS_MATCH_DISTANCE_TOLERANCE_PCT:5}
