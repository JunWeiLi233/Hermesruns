# Activate explicitly with spring.profiles.include=explorer after the additive migration.
app.explorer.enabled=${APP_EXPLORER_ENABLED:false}
app.explorer.cookie-secure=${APP_EXPLORER_COOKIE_SECURE:true}
app.explorer.allowed-origins=${APP_EXPLORER_ALLOWED_ORIGINS:}
app.explorer.public-url=${APP_EXPLORER_PUBLIC_URL:http://localhost:8080/heatmap/}
# Bounded multipart envelope; per-file/content/count limits are also checked in the service.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=101MB
