# Opt-in alongside production: SPRING_PROFILES_ACTIVE=production,sleep
# Close only idle connections; a borrowed connection is never evicted by idleTimeout.
spring.datasource.hikari.minimumIdle=0
spring.datasource.hikari.idleTimeout=60000
spring.datasource.hikari.keepaliveTime=0

# Keep manual/API/webhook sync enabled. Only recurring network polling stops.
app.background.polling.enabled=false
app.coach.nightly.cron=-
